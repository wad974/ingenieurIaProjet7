# API RAG + Ollama en local : deux conteneurs, un réseau privé interne.
#
#   docker compose up --build -d        # build + démarrage complet
#   curl http://localhost:8000/health   # vérification
#   http://localhost:8000/docs          # Swagger UI
#
# Le premier démarrage télécharge les modèles (~3-4 Go) dans le volume
# `ollama_models` ; les suivants sont instantanés et fonctionnent hors-ligne.

services:
  # --- Serveur LLM + embeddings -------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: rag-ollama
    volumes:
      - ollama_models:/root/.ollama
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 5s
      timeout: 3s
      retries: 30
    # Pour tirer parti d'un GPU NVIDIA (NVIDIA Container Toolkit requis) :
    # décommentez le bloc ci-dessous, `docker compose up` basculera sur GPU.
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  # --- Un pull des modèles, une fois, puis le conteneur s'arrête ----------
  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:2b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-embeddinggemma-2:latest}
    volumes:
      - ollama_models:/root/.ollama
      - ./docker/ollama-init.sh:/init.sh:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    restart: "no"

  # --- API FastAPI (Flux 1 /prompt, Flux 2 /ingest) ------------------------
  api:
    build: .
    container_name: rag-api
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    # `environment` a préséance sur `env_file` : dans le conteneur, Ollama
    # est visé par son nom de service, jamais par localhost.
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_HOST: http://ollama:11434
    ports:
      # Port hôte surchargeable : API_PORT=8001 docker compose up
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./bdd:/app/bdd            # index FAISS + métadonnées persistés
      - ./documents:/app/documents
      - ./logs:/app/logs
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

volumes:
  ollama_models:
